<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemoe · 写作台</title><link rel="stylesheet" href="/admin/admin.css"><script src="/admin/admin.js" defer></script></head>
<body><header><a class="brand" href="/admin/">Lemoe <span>写作台</span></a><div id="identity">正在检查登录…</div></header>
<main><section id="welcome" class="panel"><p class="eyebrow">留住灵感，写下此刻</p><h1>今天，想写些什么？</h1><p>在这里写作、保存草稿，发布到自己的博客。</p><a class="button" id="login" href="/auth/login">使用 GitHub 登录</a></section>
<div id="workspace" hidden><nav class="tabs" aria-label="后台功能"><button id="writing-tab" aria-selected="true">文章与草稿</button><button id="comments-tab" aria-selected="false">留言审核</button></nav>
<section id="writing"><div class="toolbar"><h1>文章与草稿</h1><button id="new">新建文章</button></div><div class="writing-grid"><aside class="panel"><h2>我的文章</h2><div id="posts"></div></aside>
<form id="editor" class="panel"><label>文章标题<input name="title" maxlength="160" required placeholder="给这篇文章起个名字"></label><div class="fields"><label>文章地址<input name="slug" pattern="[a-z0-9][a-z0-9-]{0,79}" maxlength="80" required placeholder="my-first-post"><small>小写字母、数字与短横线，保存后固定</small></label><label>标签<input name="tags" placeholder="随笔, C++"><small>逗号分隔，最多 8 个</small></label></div><label>摘要<textarea name="summary" rows="2" maxlength="500" placeholder="一句话介绍这篇文章"></textarea></label><label>正文 · Markdown<textarea name="body" rows="20" maxlength="60000" required placeholder="从这里开始写…"></textarea></label>
<div class="toolbar"><span id="draft-state">尚未保存</span><div class="actions"><button type="button" id="export">导出 Markdown</button><button type="button" id="preview">预览</button><button type="submit">保存草稿</button><button type="button" id="publish" class="primary">发布到博客</button><button type="button" id="unpublish" hidden>下线文章</button></div></div><p class="hint">草稿只保存在后台。发布后会自动提交到 GitHub，等待网站构建完成；你无需打开 GitHub。</p><article id="preview-content" class="prose" hidden></article></form></div></section>
<section id="moderation" hidden><h1>留言审核</h1><p>访客留言审核通过后才会公开；“隐藏”可以撤回已公开的留言。</p><button id="refresh-comments">刷新留言</button><div id="comments"></div></section></div>
<p id="status" role="status" aria-live="polite"></p></main></body></html>

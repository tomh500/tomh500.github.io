<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemoe · 写作台</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/admin/editor.css"><script src="/admin/vendor/purify.min.js" defer></script><script src="/admin/vendor/turndown.js" defer></script><script src="/admin/writer.js" defer></script></head>
<body><header><a class="brand" href="/admin/">Lemoe <span>写作台</span></a><div id="identity">正在检查登录…</div></header>
<main><section id="welcome" class="panel"><p class="eyebrow">留住灵感，写下此刻</p><h1>今天，想写些什么？</h1><p>登录后即可写作、保存草稿或投稿。访客文章由站长审核后展示。</p><a class="button" id="login" href="/auth/login">使用 GitHub 登录</a></section>
<div id="workspace" hidden><nav class="tabs" aria-label="后台功能"><button id="writing-tab" aria-selected="true">文章与草稿</button><button id="comments-tab" aria-selected="false" hidden>留言审核</button><button id="submissions-tab" aria-selected="false" hidden>投稿审核</button></nav><p id="role-note" class="hint"></p>
<section id="writing"><div class="toolbar"><h1>文章与草稿</h1><button id="new">新建文章</button></div><div class="writing-grid"><aside class="panel"><h2>我的文章</h2><div id="posts"></div></aside>
<form id="editor" class="panel"><label>文章标题<input name="title" maxlength="160" required placeholder="给这篇文章起个名字"></label><details class="advanced"><summary>标签和文章地址（选填）</summary><div class="fields"><label>文章地址<input name="slug" pattern="[a-z0-9][a-z0-9-]{0,79}" maxlength="80" placeholder="留空自动生成"><small>保存后固定，无需手动填写</small></label><label>标签<input name="tags" placeholder="随笔, C++"><small>逗号分隔，最多 8 个</small></label></div></details><label>摘要<textarea name="summary" rows="2" maxlength="500" placeholder="选填；留空时从正文生成"></textarea></label><div class="editor-toolbar" role="toolbar" aria-label="正文排版"><button type="button" data-format="bold" title="加粗">加粗</button><button type="button" data-format="italic">斜体</button><button type="button" data-block="h2">标题</button><button type="button" data-block="p">正文</button><button type="button" data-format="insertUnorderedList">无序列表</button><button type="button" data-format="insertOrderedList">有序列表</button><button type="button" data-block="blockquote">引用</button><button type="button" id="insert-link">链接</button><button type="button" data-block="pre">代码块</button><button type="button" data-format="undo">撤销</button><button type="button" data-format="redo">重做</button><button type="button" id="source-mode">Markdown 源码</button></div><div id="rich-body" class="rich-editor prose" contenteditable="true" role="textbox" aria-label="文章正文" aria-multiline="true" data-placeholder="像写文档一样输入正文，选中文字后点击上方按钮排版。"></div><textarea name="body" rows="20" maxlength="60000" hidden aria-label="Markdown 正文"></textarea>
<div class="toolbar"><span id="draft-state">尚未保存</span><div class="actions"><button type="button" id="upload-image">上传图片</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden><button type="button" id="export">导出 Markdown</button><button type="button" id="preview">预览</button><button type="submit">保存草稿</button><button type="button" id="publish" class="primary">发布到博客</button><button type="button" id="unpublish" hidden>下线文章</button></div></div><p class="hint">支持粘贴图片和上传 PNG / JPEG / GIF / WebP。大图自动压缩，GIF 最大 1 MB。未发布图片仅作者和站长可见，公开发布后随文章展示。</p><article id="preview-content" class="prose" hidden></article></form></div></section>
<section id="moderation" hidden><h1>留言审核</h1><p>访客留言审核通过后才会公开；“隐藏”可以撤回已公开的留言。</p><button id="refresh-comments">刷新留言</button><div id="comments"></div></section></div>
<section id="submissions" hidden><h1>访客投稿审核</h1><p>通过后只展示在独立的访客投稿页，列表默认折叠。不会进入站长博客或首页推荐。</p><button id="refresh-submissions">刷新投稿</button><div id="submission-list"></div></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
